llm:
  provider: "openrouter"
  api_key_env: "OPENROUTER_API_KEY"

  models:
    # For analyzing job descriptions and extracting requirements
    analysis:
      name: "anthropic/claude-3.5-sonnet"
      temperature: 0.1
      max_tokens: 4000

    # For generating cover letter drafts
    generation:
      name: "anthropic/claude-3.5-sonnet"
      temperature: 0.3
      max_tokens: 8000

    # For creating embeddings (vector search)
    embedding:
      name: "openai/text-embedding-3-small"
      dimensions: 1536
